<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Seamless, neutral micro-grain. Low contrast keeps the mat visibly white. -->
  <filter color-interpolation-filters="sRGB" id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="23" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.25" intercept="0.775"/>
      <feFuncG type="linear" slope="0.25" intercept="0.775"/>
      <feFuncB type="linear" slope="0.25" intercept="0.775"/>
      <feFuncA type="linear" slope="0.32"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#paper)"/>
</svg>
