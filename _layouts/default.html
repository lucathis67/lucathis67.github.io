<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | escape }}">
<head>
  {% include head.html %}
</head>
<body>
  {% assign t = site.data.translations[page.lang] | default: site.data.translations[site.lang] %}
  <a class="skip-link" href="#contenu">{{ t.skip_link | escape }}</a>
  {% include header.html %}
  <main id="contenu"{% if page.main_class %} class="{{ page.main_class | escape }}"{% endif %}>
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
  {% if page.layout == 'article' %}<script src="{{ '/assets/js/photo-viewer.js' | relative_url }}" defer></script>{% endif %}
  {% if page.page_script %}<script src="{{ page.page_script | relative_url }}" defer></script>{% endif %}
</body>
</html>
