{% assign t = site.data.translations[page.lang] | default: site.data.translations[site.lang] %}
<section class="contact-invitation" aria-labelledby="contact-invitation-title">
  <p class="eyebrow">{{ t.invitation_eyebrow | escape }}</p>
  <h2 id="contact-invitation-title">{{ t.invitation_title | escape }}</h2>
  <p>{{ t.invitation_text | escape }}</p>
  <a class="button-link" href="{{ t.contact_url | relative_url }}">{{ t.invitation_button | escape }} <span aria-hidden="true">→</span></a>
</section>
