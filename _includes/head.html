<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title | escape }}</title>
{% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
{% if page.robots %}<meta name="robots" content="{{ page.robots | escape }}">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
{% if page.og_type %}
<meta property="og:type" content="{{ page.og_type | escape }}">
<meta property="og:title" content="{{ page.og_title | default: page.title | escape }}">
<meta property="og:description" content="{{ page.og_description | default: page.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.og_image %}<meta property="og:image" content="{{ page.og_image | absolute_url }}">{% endif %}
<meta property="og:locale" content="{{ site.locale | escape }}">
{% endif %}
