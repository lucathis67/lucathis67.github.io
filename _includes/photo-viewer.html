<dialog class="photo-viewer" id="photo-viewer" aria-label="Photographies du reportage">
  <div class="photo-viewer-toolbar">
    <button class="photo-viewer-button photo-viewer-close" type="button" aria-label="Fermer les photographies" autofocus>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19" stroke="currentColor" stroke-width="1.25"/></svg>
    </button>
  </div>
  <div class="photo-viewer-stage" aria-busy="false">
    <div class="photo-viewer-paper" hidden>
      <img class="photo-viewer-image" alt="" decoding="async">
    </div>
    <p class="photo-viewer-message" role="status" hidden>Chargement de la photographie…</p>
  </div>
  <div class="photo-viewer-footer">
    <button class="photo-viewer-button photo-viewer-previous" type="button" aria-label="Photographie précédente">
      <svg width="40" height="24" viewBox="0 0 40 24" fill="none" aria-hidden="true">
        <path d="M34 11 8 11.7V12.3L34 13Z" fill="currentColor"/>
        <path d="m15 5-8 7 8 7" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <p class="photo-viewer-counter" role="status" aria-live="polite" aria-atomic="true"></p>
    <button class="photo-viewer-button photo-viewer-next" type="button" aria-label="Photographie suivante">
      <svg width="40" height="24" viewBox="0 0 40 24" fill="none" aria-hidden="true">
        <path d="m6 11 26 0.7v0.6L6 13Z" fill="currentColor"/>
        <path d="m25 5 8 7-8 7" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</dialog>
