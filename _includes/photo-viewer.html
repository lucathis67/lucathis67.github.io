{% assign t = site.data.translations[page.lang] | default: site.data.translations[site.lang] %}
<dialog class="photo-viewer" id="photo-viewer" aria-label="{{ t.viewer_label | escape }}" data-label-counter="{{ t.viewer_counter | escape }}" data-label-enlarge="{{ t.viewer_enlarge | escape }}" data-label-loading="{{ t.viewer_loading | escape }}" data-label-error="{{ t.viewer_error | escape }}">
  <div class="photo-viewer-toolbar">
    <button class="photo-viewer-button photo-viewer-close" type="button" aria-label="{{ t.viewer_close | escape }}" autofocus>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19" stroke="currentColor" stroke-width="1.25"/></svg>
    </button>
  </div>
  <div class="photo-viewer-stage" aria-busy="false">
    <div class="photo-viewer-paper" hidden>
      <img class="photo-viewer-image" alt="" decoding="async">
    </div>
    <p class="photo-viewer-message" role="status" hidden>{{ t.viewer_loading | escape }}</p>
  </div>
  <div class="photo-viewer-footer">
    <button class="photo-viewer-button photo-viewer-previous" type="button" aria-label="{{ t.viewer_previous | escape }}">
      {% include gallery-arrow.html direction="previous" %}
    </button>
    <p class="photo-viewer-counter" role="status" aria-live="polite" aria-atomic="true"></p>
    <button class="photo-viewer-button photo-viewer-next" type="button" aria-label="{{ t.viewer_next | escape }}">
      {% include gallery-arrow.html direction="next" %}
    </button>
  </div>
</dialog>
