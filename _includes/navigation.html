<div class="nav-container">
  <nav aria-label="Navigation principale">
    <ul>
      {% for item in site.data.navigation %}
      {% assign is_current = false %}
      {% if page.url == item.url %}{% assign is_current = true %}{% endif %}
      {% if item.url == '/portfolio.html' and page.layout == 'article' %}{% assign is_current = true %}{% endif %}
      <li><a{% if is_current %} class="current" aria-current="page"{% endif %} href="{{ item.url | relative_url }}">{{ item.title | escape }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</div>
